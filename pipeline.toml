# Pipeline configuration. Change values here, not in the scripts.

[aoi]
# Which area to build: a key of [areas] below. MADRID_AREA=<key> in the environment overrides it.
area = "full"

# Each area: centre (EPSG:25830 x, y), size in metres along the grid's +i and +j, rotation in degrees (counter-clockwise
# from east). Downloads and rasters are cached per area ($MADRID_CACHE/areas/<key>).
[areas.sol]
# Phase 1-3 test area: 500 m around Puerta del Sol (centre of the OSM square, relation 7424032)
centre = [440316.4, 4474264.1]
size = [500, 500]
rotation = 0

[areas.full]
# Templo de Debod / Plaza de Espana to the east edge of the Retiro, Glorieta de Bilbao to Atocha
# (X 439 000 - 442 750, Y 4 472 950 - 4 475 700). Rotation 0: -6 deg aligns more facade length over the whole area
# (25 % against 9.8 %, rotation_report.py) but its corners need four more LiDAR tiles (X 438); see DECISIONS.md, todo.md
centre = [440875.0, 4474325.0]
size = [3750, 2750]
rotation = 0

# Rotation comparison (Phase 4): 600 m test areas at 0 deg and at -6 deg, the rotation that aligns most facade
# length over the full area (scripts/rotation_report.py). Salamanca: the Ensanche grid east of Recoletos.
[areas.sol_r-6]
centre = [440316.4, 4474264.1]
size = [600, 600]
rotation = -6

[areas.sol_r0]
centre = [440316.4, 4474264.1]
size = [600, 600]
rotation = 0

[areas.salamanca_r-6]
centre = [442000.0, 4475000.0]
size = [600, 600]
rotation = -6

[areas.salamanca_r0]
centre = [442000.0, 4475000.0]
size = [600, 600]
rotation = 0

[elevation]
# Which point cloud feeds elevation and classification: a key of SOURCES in scripts/prep_lidar.py.
source = "pnoa_npc02"
# Metres per cell of the intermediate rasters, chosen from the source density: 1.0 with NPC02 (~5 pts/m2).
# Independent of VOXEL_SIZE (scripts/aoi.py); a denser flight (municipal 2026, ~30 pts/m2) can use 0.5 or 0.25.
resolution = 1.0
